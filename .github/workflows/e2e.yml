name: e2e

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  CARGO_INCREMENTAL: 0
  RUST_BACKTRACE: 1
  RUST_VERSION: "1.97"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - run: cargo build -p ic-idl --bin ic-idl
      - uses: actions/upload-artifact@v7
        with:
          name: ic-idl
          path: target/debug/ic-idl

  codegen:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang:
          - cpp
          - csharp
          - java
          - protobuf
          # - python
          - rust
          - typescript
          - json
          - json-schema
          - xml
          - idl

    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ic-idl
          path: target/debug
      - run: chmod +x target/debug/ic-idl
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
      - uses: actions/setup-java@v5
        if: matrix.lang == 'java'
        with:
          distribution: temurin
          java-version: "11"
      - uses: actions/setup-dotnet@v6
        if: matrix.lang == 'csharp'
        with:
          dotnet-version: "8.0.x"

      - name: install typescript
        if: matrix.lang == 'typescript'
        run: npm install -g typescript

      - name: install protoc
        if: matrix.lang == 'protobuf'
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - run: cargo xtask codegen --lang ${{ matrix.lang }} --strict-skip

  integration:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        lang:
          # - python
          - typescript
          - csharp
          - cpp
          - java
          - rust

    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: ic-idl
          path: target/debug
      - run: chmod +x target/debug/ic-idl
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@v2
      - uses: astral-sh/setup-uv@v7
        if: matrix.lang == 'python'
      - uses: oven-sh/setup-bun@v2
        if: matrix.lang == 'typescript'
      - uses: actions/setup-dotnet@v6
        if: matrix.lang == 'csharp'
        with:
          dotnet-version: "8.0.x"
      - uses: actions/setup-java@v5
        if: matrix.lang == 'java'
        with:
          distribution: temurin
          java-version: "11"
      - uses: taiki-e/install-action@v2
        if: matrix.lang == 'rust'
        with:
          tool: cargo-nextest
      - run: cargo xtask integration --lang ${{ matrix.lang }}
