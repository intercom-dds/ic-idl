default:
  image: "alpine:3.19"
  before_script:
    - apk update
    - apk add rustup clang cmake mold git ninja-build flex bison libc++ libc++-static musl-dev
    - rustup-init --profile minimal -y
    - source $HOME/.cargo/env
  tags:
    - linux
    - internet

stages:
  - lint
  - build

lint:rustfmt:
  stage: lint
  needs: []
  before_script:
    - rustup toolchain install nightly -c rustfmt
  script: cargo +nightly fmt -- --check

lint:clippy:
  stage: lint
  needs: []
  before_script:
    - rustup component add clippy
  script: cargo clippy -- -Dwarnings

build:stable:
  stage: build
  needs: []
  script:
    - rustc --version && cargo --version
    - cargo install --no-default-features --force cargo-make
    - cargo make bootstrap
    - cargo install --path install
  artifacts:
    paths:
      - "install/"
