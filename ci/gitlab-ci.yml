workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == "main"
    - if: $CI_PIPELINE_SOURCE == "schedule"

default:
  image: "alpine:3.22"
  before_script:
    - apk add --no-cache rustup cmake mold git gcc g++ samurai musl-dev clang-extra-tools cargo-deny cargo-nextest sed
    - rustup-init --profile minimal --default-toolchain 1.88.0 -y
    - source $HOME/.cargo/env

stages:
  - lint
  - build
  - test
  - release

lint:rustfmt:
  stage: lint
  needs: []
  script:
    - rustup toolchain install nightly -c rustfmt
    - cargo +nightly fmt -- --check

lint:clippy:
  stage: lint
  needs: []
  script:
    - rustup component add clippy
    - cargo clippy --workspace --lib --bins --tests -- -Dwarnings

lint:license:
  stage: lint
  needs: []
  script:
    - cargo xtask deny

lint:ipr:
  stage: lint
  needs: []
  script:
    - cargo xtask ipr

build:stable:
  stage: build
  needs: []
  script:
    - rustc --version && cargo --version
    - cargo xtask release
  artifacts:
    paths:
      - "install"

test:stable:
  stage: test
  needs: []
  script:
    - cargo nextest run --workspace --lib --bins --tests

release:bump-version:
  stage: release
  needs: []
  rules:
    - if: $CI_PIPELINE_SOURCE == "schedule"
  variables:
    GIT_DEPTH: 0
  script:
    # Get the last commit that touched the version line
    - |
      LAST_VERSION_CHANGE=$(git log -1 --format="%H" -G'^version = "' -- Cargo.toml)
      CHANGES=$(git rev-list "${LAST_VERSION_CHANGE}..HEAD" --count)
      if [ "$CHANGES" -eq 0 ]; then
        echo "no changes since last version update, skipping"
        exit 0
      fi

    # Configure git
    - git config user.email "${CI_BOT_EMAIL}"
    - git config user.name "${CI_BOT_NAME}"
    - git remote set-url origin "https://oauth2:${CI_BOT_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_PATH}.git"

    # Bump version
    - |
      CURRENT=$(grep -m1 '^version' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
      MAJOR=$(echo $CURRENT | cut -d. -f1)
      MINOR=$(echo $CURRENT | cut -d. -f2)
      PATCH=$(echo $CURRENT | cut -d. -f3)
      NEW_VERSION="$MAJOR.$MINOR.$((PATCH + 1))"
      echo "Bumping $CURRENT -> $NEW_VERSION"

    - sed -i "0,/^version = \"$CURRENT\"/s//version = \"$NEW_VERSION\"/" Cargo.toml
    - cargo update --workspace
    - git add Cargo.toml Cargo.lock
    - git commit -m "Bump version to $NEW_VERSION" -m "[skip ci]"
    - git push origin HEAD:${CI_COMMIT_REF_NAME}
