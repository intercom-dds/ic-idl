default:
  image: "alpine:3.19"
  before_script:
    - apk add --no-cache rustup cmake mold git gcc g++ samurai musl-dev clang-extra-tools
    - rustup-init --profile minimal -y
    - source $HOME/.cargo/env
  tags:
    - linux
    - internet

stages:
  - lint
  - build
  - test

lint:rustfmt:
  stage: lint
  needs: []
  script:
    - rustup toolchain install nightly -c rustfmt
    - cargo +nightly fmt -- --check

lint:clippy:
  stage: lint
  needs: []
  script:
    - rustup component add clippy
    - cargo clippy --workspace -- -Dwarnings

lint:license:
  stage: lint
  needs: []
  script:
    - cargo xtask deny

lint:ipr:
  stage: lint
  needs: []
  script:
    - cargo xtask ipr

lint:tidy:
  stage: lint
  needs: []
  script:
    - cmake . -B build -G"Ninja Multi-Config" -DCMAKE_EXPORT_COMPILE_COMMANDS=1 -DIC_TIDY=1
    - ninja -C build

build:stable:
  stage: build
  needs: []
  script:
    - rustc --version && cargo --version
    - cargo xtask release
  artifacts:
    paths:
      - "install"

test:stable:
  stage: test
  needs:
    - job: build:stable
      artifacts: true
  script:
    - cargo install --locked cargo-nextest
    - cargo nextest run --workspace --all-targets
