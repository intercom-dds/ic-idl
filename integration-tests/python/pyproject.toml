[project]
name = "integration-tests"
version = "0.0.0"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--tb=short"

[tool.ruff.lint]
select = ["ALL"]
ignore = ["COM812", "D", "SIM300", "PLR", "S"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-xdist>=3.0",
    "pytest-sugar>=1.0",
]
