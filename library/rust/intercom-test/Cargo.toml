[package]
name = "intercom-test"
version = "0.0.0"
authors = ["InterCOM DDS team <InterCOM.DDSteam@kongsberg.com>"]
edition = "2024"
publish = false

[lib]
doc = false

[[bench]]
name = "cdr2_bench"
harness = false

[dependencies]
intercom-cts = { path = "../intercom-cts", features = ["derive"] }

[dev-dependencies]
criterion = "0.5"

[build-dependencies]
intercom-build = { path = "../intercom-build" }
